<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>A Little Question ❤️</title>

    <link rel="stylesheet" href="/style.css">

</head>


<body>

    <main class="container">

        <section id="introScreen">

            <div class="terminal">

                <p>> Initializing program...</p>

                <p>> Loading memories...</p>

                <p>> Searching for someone special...</p>

                <p class="success-text">
                    > Person found ✓
                </p>

                <p>
                    > Preparing an important question<span
                        class="cursor"
                    >_</span>
                </p>

            </div>


            <div class="heart">
                ❤️
            </div>


            <h1>
                Hey,
                <span id="girlName">
                    [HER NAME]
                </span>!
            </h1>


            <p class="description">
                I made a tiny program for you...
                <br>
                And there's something I want to ask you.
            </p>


            <button
                id="continueBtn"
                class="primary-btn"
            >
                Continue →
            </button>

        </section>

    </main>


   <script src="/scripts.js"></script>

</body>

</html>
