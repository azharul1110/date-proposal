<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>A Little Question ❤️</title>

    <link rel="stylesheet" href="/style.css">

</head>


<body>

    <main class="container">

        <section id="introScreen">

            <div class="terminal">

                <p>> Initializing program...</p>

                <p>> Loading memories...</p>

                <p>> Searching for someone special...</p>

                <p class="success-text">
                    > Person found ✓
                </p>

                <p>
                    > Preparing an important question<span
                        class="cursor"
                    >_</span>
                </p>

            </div>


            <div class="heart">
                ❤️
            </div>


            <h1>
                Hey,
                <span id="girlName">
                    [HER NAME]
                </span>!
            </h1>


            <p class="description">
                I made a tiny program for you...
                <br>
                And there's something I want to ask you.
            </p>


            <button
                id="continueBtn"
                class="primary-btn"
            >
                Continue →
            </button>

        </section>

        <!-- QUESTION SCREEN -->

<section id="questionScreen" class="hidden">

    <div class="heart">
        ❤️
    </div>


    <h1>
        So...
    </h1>


    <p class="description">
        Would you like to go on a date with me?
    </p>


    <div class="question-buttons">

        <button
            id="yesBtn"
            class="primary-btn"
        >
            YES ❤️
        </button>


        <button
            id="noBtn"
            class="no-btn"
        >
            NO
        </button>

    </div>


    <!-- Message shown after NO -->

    <div
        id="message"
        class="no-message"
    ></div>

</section>

    </main>


   <script src="/scripts.js"></script>

</body>

</html>
